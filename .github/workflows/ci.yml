name: CI

# Runs on every pull request against main + every push to main.
# Faster feedback than waiting for a tag to build.
#
# Not intended to gate merges by default — if you want that, add a
# branch protection rule that requires "CI / test" to pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs: if a PR gets force-pushed or new commits
# arrive mid-build, abandon the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + test (macOS)
    # macos-15 ships Xcode 16 by default, giving us Swift 6.0.
    # Our Package.swift demands swift-tools-version 6.0.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install rmapi
        # Not strictly required for the non-live test suite, but having
        # it on PATH matches a real dev environment and lets doctor
        # smoke tests run if we ever add them.
        #
        # Use OUR tap, not io41/tap. v0.2.24+ pinned rmapi via a
        # formula we control because io41/tap was stuck at 0.0.29
        # through the 2026-04 cloud schema-v4 break that 400's
        # every put. CI was still installing 0.0.29 from io41/tap
        # for several releases after, which silently invalidated
        # any live-smoke run against the new cloud (rmapi account
        # itself returned non-zero, which the auth-check below
        # mis-classified as "secret expired"). Pulling from our
        # tap keeps CI on the same rmapi version users get.
        run: brew install madhavsuresh/rmsync/rmapi

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            swift/.build
            ~/.cache/org.swift.swiftpm
          # Cache key changes on Package.resolved so dependency bumps
          # invalidate cleanly. Source edits still rebuild incrementally.
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build (debug)
        working-directory: swift
        run: swift build

      - name: Test
        working-directory: swift
        # Default suite only — the live-cloud smoke tests that gate on
        # RMSYNC_LIVE=1 require rmapi to have real cloud auth, which a
        # CI runner doesn't. They early-return when the env var is
        # absent, so this command skips them implicitly.
        #
        # ``--no-parallel`` + explicit stdout pipe work around a
        # swift-testing hang on Swift 6.0 / macos-15 runners: the
        # default parallel test dispatch hangs indefinitely with
        # zero output, until the runner force-kills the orphan
        # ``swiftpm-testing`` process. Seen on runs from 2026-04-18
        # onward, predates the SyncWorker data-loss fix. Serialising
        # the run AND piping stdout through ``cat`` bypasses both
        # the dispatch deadlock and any non-TTY buffering issue.
        # Total runtime is still under 30s because the suite is tiny.
        # 10-minute hard timeout so a regression fails fast instead
        # of burning an hour of CI minutes.
        timeout-minutes: 10
        run: |
          mock_bin="$(swift build --show-bin-path)/rmapi-mock"
          RMAPI_MOCK_BIN="$mock_bin" swift test --no-parallel 2>&1 | cat

      - name: Verify release build
        working-directory: swift
        # Catch Sendable / release-only issues the debug build would
        # miss. Universal cross-compile exercises what the release
        # workflow will actually produce.
        run: |
          swift build \
            --disable-sandbox \
            -c release \
            --arch arm64 \
            --arch x86_64

      - name: Verify --help output
        # Cheap sanity: make sure the CLI binary loads its deps and
        # ArgumentParser wiring is intact. Mirrors the test block in
        # Formula/rmsync.rb.
        working-directory: swift
        run: |
          ./.build/apple/Products/Release/rmsync --help | grep -E '^SUBCOMMANDS:'
          ./.build/apple/Products/Release/rmsync --help | grep -E '(status|doctor|relocate)'

  # Linux build job. Catches Linux-specific compile errors as soon as
  # they land on main — the macOS test job above can't, because the
  # ``#if os(macOS)`` / ``#if os(Linux)`` guards mean each platform
  # only sees its own half of the code.
  #
  # Runs in the upstream ``swift:6.1-jammy`` container so we don't
  # depend on whatever Swift version Ubuntu's apt has at any given
  # moment. Same Swift toolchain the Dockerfile uses.
  linux-build:
    name: Build + test (Linux)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        # libsqlite3-dev for GRDB; ca-certificates for SwiftPM HTTPS
        # fetches. The ``swift`` image ships build-essential + git but
        # not these.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev ca-certificates

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        working-directory: swift
        # ``--disable-sandbox`` is required inside Docker — there's no
        # sandbox-exec on Linux, and sandboxed build aborts on missing
        # /usr/sbin/sandbox-exec. Same reason the Dockerfile uses it.
        run: swift build --disable-sandbox

      - name: Test
        working-directory: swift
        # Live-cloud tests gate on RMSYNC_LIVE=1; not setting it skips
        # them. macOS-only test files (``XattrsTests``,
        # ``FileProviderDetectionTests``) are gated by ``#if
        # os(macOS)`` so they compile to nothing here and don't count.
        timeout-minutes: 10
        run: |
          mock_bin="$(swift build --disable-sandbox --show-bin-path)/rmapi-mock"
          RMAPI_MOCK_BIN="$mock_bin" swift test --no-parallel --disable-sandbox 2>&1 | cat

      - name: Verify release build + --help output
        working-directory: swift
        # Same sanity check the macOS job runs, against the Linux
        # release binary.
        run: |
          swift build --disable-sandbox -c release --product rmsync
          ./.build/release/rmsync --help | grep -E '^SUBCOMMANDS:'
          ./.build/release/rmsync --help | grep -E '(status|doctor)'

  # Live-cloud smoke test against a dedicated rmapi test account.
  #
  # Why this exists: the offline ``test`` job above can't catch
  # "works on my machine, breaks on a fresh install" because it has
  # no real cloud roundtrip. Bugs like the v0.2.10 missing-config
  # issue and v0.2.11 throttle false-positive both surfaced first
  # on a tester's fresh install — exactly the kind of state CI
  # didn't have.
  #
  # Setup (one-time): see docs/TESTING.md for how to provision the
  # TEST_RMAPI_CONFIG secret. Without it, this job no-ops cleanly.
  #
  # Skipped on pull_request from forks since secrets don't leak to
  # forked-PR runs anyway, but we make the gate explicit so the
  # behavior is obvious from this file.
  live-smoke:
    name: Live cloud smoke
    needs: test
    runs-on: macos-15
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for rmapi test config
        id: check
        env:
          TOKEN: ${{ secrets.TEST_RMAPI_CONFIG }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TEST_RMAPI_CONFIG not configured; skipping live cloud smoke."
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rmapi
        if: steps.check.outputs.has_secret == 'true'
        # Same tap-pinned rmapi as the unit-test job above. See the
        # comment there for the io41/tap-vs-our-tap story.
        run: brew install madhavsuresh/rmsync/rmapi

      - name: Decode rmapi config
        if: steps.check.outputs.has_secret == 'true'
        env:
          TEST_RMAPI_CONFIG: ${{ secrets.TEST_RMAPI_CONFIG }}
        run: |
          # The secret is the base64-encoded contents of an authed
          # rmapi.conf. For a personal-use repo this is the dev's
          # personal account; see docs/TESTING.md for the risk
          # discussion.
          #
          # Path note: rmapi on macOS uses Go's os.UserConfigDir(),
          # which resolves to ``~/Library/Application Support/rmapi/``
          # on macOS — NOT ``~/.config/rmapi/`` like Linux. We write
          # to BOTH paths so the workflow works on either runner OS
          # without forking. Documented after a v0.2.12 verification
          # run failed because the workflow only wrote to the Linux
          # path and the macOS rmapi binary couldn't find it.
          mkdir -p "$HOME/.config/rmapi" \
                   "$HOME/Library/Application Support/rmapi"
          # ``--decode`` works on both BSD (macOS ``base64 -D``) and
          # GNU coreutils (``base64 -d``). The portable spelling
          # avoids the BSD-vs-GNU split.
          printf '%s' "$TEST_RMAPI_CONFIG" | base64 --decode \
            > "$HOME/Library/Application Support/rmapi/rmapi.conf"
          cp "$HOME/Library/Application Support/rmapi/rmapi.conf" \
             "$HOME/.config/rmapi/rmapi.conf"
          chmod 0600 "$HOME/.config/rmapi/rmapi.conf" \
                     "$HOME/Library/Application Support/rmapi/rmapi.conf"

      - name: Verify rmapi can reach the cloud
        if: steps.check.outputs.has_secret == 'true'
        run: |
          # ``rmapi account`` returns 0 when the cloud accepts the
          # device-token + user-token + cloud-API-version combo, and
          # non-zero on ANY of: expired refresh token, broken
          # rmapi-vs-cloud schema mismatch (the 2026-04 schema-v4
          # break that bricked rmapi <0.0.32), or transient network
          # failure. We previously bucketed all three as "secret is
          # invalid or expired" and lost two hours chasing a stale
          # secret when the actual cause was io41/tap shipping an
          # rmapi version too old for the new cloud schema.
          #
          # Capture stderr so the failure mode is visible. rmapi's
          # version is a CRITICAL signal: if the auth-check fails
          # AND ``rmapi version`` is below the schema-v4 minimum
          # (0.0.32), the diagnosis is "wrong rmapi installed" not
          # "credentials bad". Print both before the verdict so
          # whoever debugs next has the data without re-running.
          echo "rmapi version: $(rmapi version 2>&1 || echo '<failed>')"
          if err=$(rmapi account 2>&1 >/dev/null); then
            echo "✓ rmapi authenticated against cloud"
          else
            ec=$?
            echo "✗ rmapi cloud op failed (exit ${ec})"
            echo "  stderr: ${err}"
            echo ""
            echo "  Diagnosis tree:"
            echo "    - 'HTTP 4xx' or 'schema' in stderr → rmapi is too old for the current cloud schema"
            echo "      (this CI installs from madhavsuresh/rmsync; check the formula's pin)"
            echo "    - 'unauthorized' or '401'         → secret has rotated; re-encode rmapi.conf"
            echo "      and update the TEST_RMAPI_CONFIG repo secret"
            echo "    - network / DNS / timeout         → transient; rerun"
            exit 1
          fi

      - name: Live cloud smoke test
        if: steps.check.outputs.has_secret == 'true'
        working-directory: swift
        timeout-minutes: 15
        env:
          RMSYNC_LIVE: "1"
        run: |
          # PushSmokeTests + CloudSmokeTests gate on RMSYNC_LIVE=1.
          # They write probe docs into ``/rmsync-test`` on the test
          # account, verify roundtrip, then clean up. Running them
          # against a real cloud catches any regression in the push
          # path (the kind that wouldn't show up offline because
          # we'd need to actually shell to rmapi for it to fail).
          swift test --no-parallel --filter '(?i)(cloud|push)' 2>&1 | cat
