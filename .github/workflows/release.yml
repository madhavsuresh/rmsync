name: release

# On tag push (vX.Y.Z):
#   1. Build universal (arm64 + x86_64) release binaries.
#   2. Run the non-live test suite.
#   3. Compute SHA256 of the GitHub-generated source tarball for the tag.
#   4. Create a GitHub Release and attach binaries.
#   5. Open a PR against the Homebrew tap repo bumping url + sha256.
#
# Requires one repo secret if you want step 5 to work:
#   TAP_REPO_TOKEN  — a fine-grained PAT with write access to the
#                     homebrew-rmsync tap repo. Without it, the
#                     "bump-formula" job is skipped; you bump manually.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release
  packages: write   # push image to ghcr.io/madhavsuresh/rmsync

jobs:
  build:
    name: Build + test
    # macos-15 ships Xcode 16 by default (Swift 6.0). Cross-compiles
    # both arm64 and x86_64 from the Apple Silicon runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install rmapi for tests
        run: brew install io41/tap/rmapi

      - name: Build universal release
        working-directory: swift
        run: |
          swift build \
            --disable-sandbox \
            -c release \
            --arch arm64 \
            --arch x86_64

      - name: Run tests (non-live)
        # Tests run in debug config. ``swift test -c release`` combined
        # with swift-testing on macos-15 / Swift 6.0 mis-invokes the
        # test bundle — the release rmsync binary gets ``--test-bundle-path``
        # as a CLI arg and bails. XCTest tests still ran but swift-testing
        # @Test suites were skipped entirely, silently. Using the default
        # debug config runs both test runners correctly.
        #
        # ``--no-parallel`` + piping through ``cat`` works around a
        # separate swift-testing / macos-15 hang where the default
        # parallel dispatch deadlocks with zero output. See ci.yml
        # for the full write-up; both workflows need the same
        # invocation.
        working-directory: swift
        timeout-minutes: 10
        run: swift test --no-parallel 2>&1 | cat

      - name: Package binaries
        id: package
        working-directory: swift
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTDIR="rmsync-${VERSION}-macos-universal"
          mkdir -p "../${OUTDIR}"

          # SPM drops universal builds under .build/apple/…
          cp .build/apple/Products/Release/rmsync "../${OUTDIR}/"
          cp .build/apple/Products/Release/rmsync-menubar "../${OUTDIR}/"

          cd ..
          cp -R scripts "${OUTDIR}/"
          cp -R assets "${OUTDIR}/"
          cp -R docs "${OUTDIR}/"
          cp README.md install.sh uninstall.sh "${OUTDIR}/"

          # Strip debug symbols so the tarball doesn't ship debug info.
          strip -x "${OUTDIR}/rmsync" "${OUTDIR}/rmsync-menubar"

          tar czf "${OUTDIR}.tar.gz" "${OUTDIR}"
          shasum -a 256 "${OUTDIR}.tar.gz" | tee "${OUTDIR}.tar.gz.sha256"

          echo "tarball=${OUTDIR}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "shafile=${OUTDIR}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Compute source-tarball SHA (for Homebrew `url`)
        id: srcsha
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "Downloading $URL"
          curl -sL "$URL" -o src.tar.gz
          SRC_SHA=$(shasum -a 256 src.tar.gz | awk '{print $1}')
          echo "src_sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          echo "src_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Source tarball SHA256: $SRC_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.shafile }}
          body: |
            ## Installation

            ### Homebrew

            ```
            brew install madhavsuresh/rmsync/rmsync
            ```

            ### From source

            ```
            git clone https://github.com/${{ github.repository }}.git
            cd rmsync && ./install.sh
            ```

            ### From release tarball (no Swift toolchain required)

            ```
            curl -L ${{ steps.srcsha.outputs.src_url }} -o src.tar.gz
            # … or download the ${{ steps.package.outputs.tarball }} attached below
            ```

            ## Formula values for the tap

            ```
            url    "${{ steps.srcsha.outputs.src_url }}"
            sha256 "${{ steps.srcsha.outputs.src_sha }}"
            ```

  # Build and publish the multi-arch Docker image to GHCR. Runs in
  # parallel with bump-formula and after the build job so we don't
  # burn cycles on a tag whose tests didn't pass.
  #
  # GHCR is free for public repos. ``GITHUB_TOKEN`` already has
  # ``packages: write`` permission via the workflow-level grant up
  # top, so no separate PAT needed.
  #
  # Multi-arch via QEMU + buildx. amd64 is the runner's native arch
  # so it's cheap; arm64 is emulated and adds a few minutes per
  # build. Total tag-to-image-on-GHCR is ~6–8 minutes.
  docker-publish:
    name: Build + push Docker image
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rmsync
          # ``v0.2.13`` → tags ``0.2.13``, ``0.2``, ``latest``.
          # ``raw`` adds the unprefixed tag string verbatim.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only for now. arm64 was attempted at v0.2.15 but
          # the swift-from-source compilation under QEMU x86→arm64
          # emulation took >1 hour and never finished — GitHub
          # Actions burns CI minutes faster than we can iterate.
          # Reintroduce arm64 once we have either:
          #   - a native arm64 GitHub runner (paid tier or the new
          #     free ARM-hosted runners),
          #   - or a precompiled rmsync-arm64 binary that we copy
          #     into the image instead of building inside it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers across runs to avoid re-downloading the
          # Swift toolchain image and re-fetching SwiftPM deps every
          # release. ``gha`` is GitHub's free in-actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-formula:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    needs: build
    # The `secrets` context can't be used in a job-level `if:` — we
    # check at the first step instead and short-circuit subsequent
    # steps when the PAT isn't configured.
    steps:
      - name: Check for tap PAT
        id: check
        env:
          TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_REPO_TOKEN not configured; skipping tap bump."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute source SHA
        if: steps.check.outputs.has_token == 'true'
        id: srcsha
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -sL "$URL" -o src.tar.gz
          SRC_SHA=$(sha256sum src.tar.gz | awk '{print $1}')
          echo "src_sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          echo "src_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check out main repo (for canonical Formula body)
        if: steps.check.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          # Default ``ref`` is the tag that triggered this workflow, so
          # the Formula body we pick up matches the source tarball the
          # tap will point at. No version-skew window.
          path: main-repo

      - name: Check out tap repo
        if: steps.check.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-rmsync
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.check.outputs.has_token == 'true'
        working-directory: tap
        run: |
          # Copy the full Formula body from the main repo — NOT just
          # url+sha. The previous behaviour (two sed lines only) meant
          # any change to def install / def post_install / caveats here
          # never propagated to the tap; users installed stale Formula
          # logic against new source tarballs. Fixed 2026-04-20 after
          # the ``rmsync --version``-prints-``dev`` bug:
          # ``inreplace`` + ``post_install`` in v0.2.5's Formula never
          # ran on the installed binary because the tap's Formula
          # still matched v0.2.0's shape.
          FORMULA="Formula/rmsync.rb"

          # Re-anchor on the latest tap origin/main right before we
          # build the bump branch. ``actions/checkout`` fetched main
          # once at the start of this job, but a previous release's
          # tap PR can land in the window between checkout and now —
          # we'd otherwise commit on top of a stale base and the
          # resulting bump PR would open in the ``CONFLICTING`` state
          # the moment GitHub re-evaluates against main. Using ``-B``
          # makes the branch creation idempotent for workflow re-runs;
          # ``--force-with-lease`` on the push below is the matching
          # safety net (refuses to overwrite if someone else pushed to
          # this branch concurrently). Lesson from v0.2.36: a stale
          # bump-v0.2.36 sat at v0.2.34's main while v0.2.35's tap PR
          # was still open; once #35 merged, #36 conflicted on the
          # url/sha lines and required manual resolution.
          git fetch origin main
          git checkout -B "bump-${GITHUB_REF_NAME}" origin/main

          cp "${GITHUB_WORKSPACE}/main-repo/Formula/rmsync.rb" "$FORMULA"
          # Rewrite the canonical upstream ``url``/``sha256`` placeholders
          # to this tag's values. The upstream Formula ships with
          # ``v0.2.0`` + an all-zeros sha as the placeholder — no other
          # Formula line matches both regexes, so this is safe.
          sed -i -E "s|url \".*\"|url \"${{ steps.srcsha.outputs.src_url }}\"|" "$FORMULA"
          sed -i -E "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${{ steps.srcsha.outputs.src_sha }}\"|" "$FORMULA"

          git config user.name "rmsync release bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "rmsync ${GITHUB_REF_NAME}"
          git push -u origin "bump-${GITHUB_REF_NAME}" --force-with-lease

      - name: Open PR on tap (wait for CI, then merge)
        if: steps.check.outputs.has_token == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          # ``gh pr create`` prints the PR URL on its last line.
          # We grab it so the immediately-following ``gh pr merge``
          # call can act on the right PR — relying on "the most
          # recent PR on this branch" is racy when a fresh release
          # opens during a daily-cron rmapi bump.
          #
          # Body is a single-line string on purpose: a previous
          # version of this step used ``\<newline>`` continuations
          # to break the body across lines, but YAML treats any
          # column-1 content inside a ``run: |`` block as ending
          # the literal block, so the workflow file was rejected
          # with "could not find expected ':'" at parse time and
          # ALL of v0.2.30 / v0.2.31 release runs failed at 0s
          # before any job could start. Lesson: keep the body
          # string on one line and put the prose in this comment.
          BODY="Automated bump from $GITHUB_REPOSITORY release ${GITHUB_REF_NAME}. Merges after Formula audit passes."
          PR_URL=$(gh pr create \
            --title "rmsync ${GITHUB_REF_NAME}" \
            --body  "$BODY" \
            --base  main \
            --head  "bump-${GITHUB_REF_NAME}" \
            | tail -1)
          echo "Opened tap PR: $PR_URL"

          # Wait for tap CI (Formula audit) to terminate, then merge.
          #
          # v0.2.37: replaced ``gh pr merge --auto`` because the
          # tap's default branch isn't behind branch-protection
          # rules with auto-merge enabled. ``--auto`` returned
          # "Pull request is in clean status (enablePullRequestAuto-
          # Merge)" / "Protected branch rules not configured"
          # depending on the PR's mergeable-state at call time and
          # exited 1 — every release run since v0.2.30 went red on
          # this step even though the PRs eventually merged via a
          # separate path (or by hand).
          #
          # GitHub often needs a few seconds to attach the tap CI run
          # to the freshly-opened PR. ``gh pr checks --watch`` exits 1
          # immediately if it sees "no checks reported", so wait until
          # at least one check exists before entering watch mode.
          CHECK_WAIT_ATTEMPTS=60
          for (( attempt=1; attempt<=CHECK_WAIT_ATTEMPTS; attempt++ )); do
            set +e
            CHECK_COUNT=$(gh pr checks "$PR_URL" --json name --jq 'length' 2>/dev/null)
            set -e

            case "$CHECK_COUNT" in
              ''|*[!0-9]*) CHECK_COUNT=0 ;;
            esac

            if [ "$CHECK_COUNT" -gt 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$CHECK_WAIT_ATTEMPTS" ]; then
              echo "Timed out waiting for tap CI checks to appear on $PR_URL" >&2
              exit 1
            fi

            echo "Waiting for tap CI checks to appear ($attempt/$CHECK_WAIT_ATTEMPTS)..."
            sleep 5
          done

          # ``gh pr checks --watch`` polls every 10s until all checks
          # reach a terminal status; exits non-zero if any required
          # check failed. With ``set -e`` (default for ``run: |``), a
          # red CI fails this step. On green, fall through to a direct
          # squash-merge.
          gh pr checks "$PR_URL" --watch
          gh pr merge "$PR_URL" --squash --delete-branch
