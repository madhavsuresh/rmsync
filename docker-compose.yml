# Single-service compose for rmsync. Three ways to use it:
#
#   1. Quickstart (recommended):
#        curl -fsSL https://raw.githubusercontent.com/madhavsuresh/rmsync/main/scripts/docker-quickstart.sh | sh
#      That script writes a customised version of this file into
#      ./rmsync/, with the host user's UID:GID baked in so files
#      written into ./data/sync are owned by you (not root).
#
#   2. Manual:
#        mkdir -p data/{config,state,sync}
#        curl -fsSL -o docker-compose.yml \
#          https://raw.githubusercontent.com/madhavsuresh/rmsync/main/docker-compose.yml
#        # Uncomment the user: line below with your UID:GID.
#        docker compose up -d
#
#   3. From a clone of this repo: ``docker compose up -d`` works
#      directly, but the daemon runs as root → files in ./data/sync
#      end up root-owned. Edit user: line first.
#
# After it's up:
#
#   docker exec -it rmsync rmapi          # one-time reMarkable auth
#   docker exec rmsync rmsync doctor      # all ✓
#   docker exec rmsync rmsync status      # live state
#   docker logs -f rmsync                 # structured-JSON daemon log
#
# inotify watch limit: if your sync tree has more than ~5000
# subdirectories, raise the host's ``fs.inotify.max_user_watches``
# (default 8192). See docs/DOCKER.md for the one-line fix.

services:
  rmsync:
    image: ghcr.io/madhavsuresh/rmsync:latest
    container_name: rmsync
    restart: unless-stopped

    # Run the daemon as your host user so files written into
    # ./data/sync end up owned by you. Set to your ``id -u:id -g``.
    # Without this the daemon runs as root and you can't edit the
    # synced files from your host editor without sudo. The
    # quickstart script bakes this in automatically.
    # user: "1000:1000"

    volumes:
      # rmapi.conf (one-time auth) + config.toml — survives restarts.
      - ./data/config:/config
      # state.db, ipc.sock — daemon-private; don't edit by hand.
      - ./data/state:/state
      # Your reMarkable-bound .md tree. Edit files here on the host.
      - ./data/sync:/sync

    healthcheck:
      # ``rmsync status`` exits 0 when the daemon's IPC socket is
      # responsive (<100ms typical). 60s start_period gives the
      # initial reconcile time to finish before the healthcheck
      # counts against container health.
      test: ["CMD", "/usr/local/bin/rmsync", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
